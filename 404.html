<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Страница не найдена — ДИКМАН’S deli</title>
  <style>
    :root { --paper: #faf7f0; --ink: #141413; --red: #d92329; --green: #1b633c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: Arial, "Helvetica Neue", sans-serif; padding: 24px; }
    main { width: min(560px, 100%); border-top: 8px solid var(--red); padding-top: 28px; }
    .brand { font-size: 14px; font-weight: 800; letter-spacing: .12em; color: var(--green); text-transform: uppercase; }
    h1 { margin: 18px 0 14px; font-size: clamp(38px, 8vw, 64px); line-height: .98; letter-spacing: -.05em; text-transform: uppercase; }
    p { max-width: 460px; color: #5b5953; line-height: 1.6; }
    a { display: inline-flex; min-height: 48px; align-items: center; margin-top: 22px; padding: 0 22px; background: var(--red); color: #fff; font-weight: 700; text-decoration: none; }
    a:hover { background: var(--ink); }
    a:focus-visible { outline: 3px solid var(--green); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ДИКМАН’S deli · Сытный рынок</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес изменился. Вернитесь на главную, чтобы посмотреть меню, цены и условия для HoReCa.</p>
    <a id="homeLink" href="./">На главную</a>
  </main>
  <script>
    document.getElementById('homeLink').href = location.pathname.indexOf('/dn-s-Deli/') === 0 ? '/dn-s-Deli/' : '/';
  </script>
</body>
</html>
